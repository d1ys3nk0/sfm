version: '3'

tasks:
  check:
    desc: Verify formatting, static analysis, modules, race tests, and vulnerabilities
    cmds:
      - make lint-chk
      - go run github.com/zricethezav/gitleaks/v8@v8.30.0 dir --no-banner .
      - go mod tidy -diff
      - go test -race ./...
      - go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
  build:
    desc: Build the SFM executable
    cmds:
      - sh -c 'revision=$(git rev-parse --verify HEAD 2>/dev/null || echo unknown); test -z "$(git status --porcelain --untracked-files=all)" || revision="$revision-dirty"; go build -trimpath -ldflags "-X main.version=dev -X main.commit=$revision" -o bin/sfm ./cmd/sfm'
  fix:format:
    desc: Format Go source files
    cmds:
      - gofmt -w cmd internal
